hostname CE2A
no ip domain-lookup
ip cef
!
interface Loopback0
 ip address 172.16.2.1 255.255.255.255
 no shutdown
!
interface FastEthernet0/0
 description To PE2
 ip address 192.168.10.6 255.255.255.252
 no shutdown
!
interface Loopback1
 description Customer A Site 2 Loopback
 ip address 172.16.2.2 255.255.255.255
 no shutdown
!
router bgp 65001
 bgp log-neighbor-changes
 bgp router-id 172.16.2.1
 neighbor 192.168.10.5 remote-as 65000
 !
 address-family ipv4
  neighbor 192.168.10.5 activate
  network 172.16.2.2 mask 255.255.255.255
 exit-address-family
!
line vty 0 4
 login local
 transport input ssh
!
end
