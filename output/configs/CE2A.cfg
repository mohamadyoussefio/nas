hostname CE2A
no ip domain-lookup
ip cef
!
username admin privilege 15 password admin
aaa new-model
aaa authentication login default local
aaa authorization exec default local
ip scp server enable
!
interface Loopback0
 ip address 172.16.2.1 255.255.255.255
 no shutdown
!
interface FastEthernet0/0
 description To PE2
 ip address 192.168.10.6 255.255.255.252
 no shutdown
!
interface Loopback1
 description Customer A Site 2 Loopback
 ip address 172.16.2.2 255.255.255.255
 no shutdown
!
interface Loopback100
 description Shared Service Prefix (Backup on CE2A)
 ip address 172.16.100.1 255.255.255.255
 no shutdown
!
route-map RM_PREPEND_OUT permit 10
set as-path prepend 65001 65001 65001!
router bgp 65001
 bgp log-neighbor-changes
 bgp router-id 172.16.2.1
neighbor 192.168.10.5 remote-as 65000
!
 address-family ipv4
neighbor 192.168.10.5 activate
neighbor 192.168.10.5 route-map RM_PREPEND_OUT outnetwork 172.16.2.2 mask 255.255.255.255
network 172.16.100.1 mask 255.255.255.255
exit-address-family
!line vty 0 4
 login local
 transport input ssh
!
end
