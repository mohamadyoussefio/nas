hostname PE1
no ip domain-lookup
ip cef
mpls label protocol ldp
mpls ldp router-id Loopback0 force
!
ip vrf Client_A
 rd 65000:1
 route-target import 65000:1
 route-target export 65000:1
!
ip vrf Client_B
 rd 65000:2
 route-target import 65000:2
 route-target export 65000:2
!
interface Loopback0
 ip address 10.0.0.1 255.255.255.255
 ip ospf 1 area 0
 no shutdown
!
interface FastEthernet0/0
 description P2P to P1
 ip address 10.0.12.1 255.255.255.252
 ip ospf 1 area 0
 mpls ip
 no shutdown
!
interface FastEthernet1/0
 description Client_A site on PE1
 ip vrf forwarding Client_A
 ip address 192.168.10.1 255.255.255.252
 no shutdown
!
interface FastEthernet1/1
 description Client_B site on PE1
 ip vrf forwarding Client_B
 ip address 192.168.20.1 255.255.255.252
 no shutdown
!
router ospf 1
 router-id 10.0.0.1
 passive-interface Loopback0
!
router bgp 65000
 bgp log-neighbor-changes
 bgp router-id 10.0.0.1
 neighbor 10.0.0.4 remote-as 65000
 neighbor 10.0.0.4 update-source Loopback0
 !
 address-family vpnv4
  neighbor 10.0.0.4 activate
  neighbor 10.0.0.4 send-community both
 exit-address-family
 !
 address-family ipv4 vrf Client_A
  neighbor 192.168.10.2 remote-as 65001
  neighbor 192.168.10.2 activate
 exit-address-family
 !
 address-family ipv4 vrf Client_B
  neighbor 192.168.20.2 remote-as 65002
  neighbor 192.168.20.2 activate
 exit-address-family
!
line vty 0 4
 login local
 transport input ssh
!
end
