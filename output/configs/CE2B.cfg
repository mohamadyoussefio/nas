hostname CE2B
no ip domain-lookup
ip cef
!
username admin privilege 15 password admin
aaa new-model
aaa authentication login default local
aaa authorization exec default local
ip scp server enable
!
interface Loopback0
 ip address 172.16.4.1 255.255.255.255
 no shutdown
!
interface FastEthernet0/0
 description To PE2
 ip address 192.168.20.6 255.255.255.252
 no shutdown
!
interface Loopback1
 description Customer B Site 2 Loopback
 ip address 172.16.4.2 255.255.255.255
 no shutdown
!
router bgp 65002
 bgp log-neighbor-changes
 bgp router-id 172.16.4.1
neighbor 192.168.20.5 remote-as 65000
!
 address-family ipv4
neighbor 192.168.20.5 activate
network 172.16.4.2 mask 255.255.255.255
exit-address-family
!line vty 0 4
 login local
 transport input ssh
!
end
