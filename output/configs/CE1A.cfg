hostname CE1A
no ip domain-lookup
ip cef
!
username admin privilege 15 password admin
aaa new-model
aaa authentication login default local
aaa authorization exec default local
ip scp server enable
!
interface Loopback0
 ip address 172.16.1.1 255.255.255.255
 no shutdown
!
interface FastEthernet0/0
 description To PE1
 ip address 192.168.10.2 255.255.255.252
 no shutdown
!
interface Loopback1
 description Customer A Site 1 Loopback
 ip address 172.16.1.2 255.255.255.255
 no shutdown
!
interface Loopback100
 description Shared Service Prefix (Primary on CE1A)
 ip address 172.16.100.1 255.255.255.255
 no shutdown
!
router bgp 65001
 bgp log-neighbor-changes
 bgp router-id 172.16.1.1
neighbor 192.168.10.1 remote-as 65000
!
 address-family ipv4
neighbor 192.168.10.1 activate
network 172.16.1.2 mask 255.255.255.255
network 172.16.100.1 mask 255.255.255.255
exit-address-family
!line vty 0 4
 login local
 transport input ssh
!
end
