hostname PE2
no ip domain-lookup
ip cef
!
username admin privilege 15 password admin
aaa new-model
aaa authentication login default local
aaa authorization exec default local
ip scp server enable
!
mpls label protocol ldp
mpls ldp router-id Loopback0 force
mpls traffic-eng tunnels
ip rsvp signalling hello!ip vrf Client_A
 rd 65000:1
route-target import 65000:1
route-target import 65000:100
route-target import 65000:99
route-target export 65000:1
route-target export 65000:100
!
ip vrf Client_B
 rd 65000:2
route-target import 65000:2
route-target import 65000:100
route-target export 65000:2
route-target export 65000:100
!
ip vrf INTERNET
 rd 65000:99
route-target import 65000:99
route-target export 65000:99
!
ip route vrf INTERNET 0.0.0.0 0.0.0.0 Null0
!interface Loopback0
 ip address 10.0.0.4 255.255.255.255
ip ospf network point-to-point
 ip ospf 1 area 0 no shutdown
!
interface FastEthernet0/0
 description P2P to P2
 ip address 10.0.34.2 255.255.255.252
ip ospf network point-to-point
 ip ospf 1 area 0mpls ipip rsvp bandwidth 75000
 mpls traffic-eng tunnels no shutdown
!
interface FastEthernet1/0
 description Client_A site on PE2
ip vrf forwarding Client_A ip address 192.168.10.5 255.255.255.252
 no shutdown
!
interface FastEthernet1/1
 description Client_B site on PE2
ip vrf forwarding Client_B ip address 192.168.20.5 255.255.255.252
 no shutdown
!
interface Tunnel1
 description TE-to-PE1
 ip unnumbered Loopback0
 tunnel mode mpls traffic-eng
 tunnel destination 10.0.0.1
 tunnel mpls traffic-eng autoroute announce
 tunnel mpls traffic-eng priority 7 7
 tunnel mpls traffic-eng bandwidth 5000
 tunnel mpls traffic-eng path-option 1 dynamic
 no shutdown
!
router ospf 1
 router-id 10.0.0.4
 passive-interface Loopback0
mpls traffic-eng router-id Loopback0
 mpls traffic-eng area 0!router bgp 65000
 bgp log-neighbor-changes
 bgp router-id 10.0.0.4
neighbor 10.0.0.1 remote-as 65000
 neighbor 10.0.0.1 update-source Loopback0
!
 address-family vpnv4
neighbor 10.0.0.1 activate
  neighbor 10.0.0.1 send-community both
exit-address-family
!
 address-family ipv4 vrf Client_A
  neighbor 192.168.10.6 remote-as 65001
  neighbor 192.168.10.6 activate
  neighbor 192.168.10.6 as-override
exit-address-family
!
 address-family ipv4 vrf Client_B
  neighbor 192.168.20.6 remote-as 65002
  neighbor 192.168.20.6 activate
  neighbor 192.168.20.6 as-override
exit-address-family
!
 address-family ipv4 vrf INTERNET
network 0.0.0.0 mask 0.0.0.0exit-address-family
!line vty 0 4
 login local
 transport input ssh
!
end
