hostname CE1B
no ip domain-lookup
ip cef
!
interface Loopback0
 ip address 172.16.3.1 255.255.255.255
 no shutdown
!
interface FastEthernet0/0
 description To PE1
 ip address 192.168.20.2 255.255.255.252
 no shutdown
!
interface Loopback1
 description Customer B Site 1 Loopback
 ip address 172.16.3.2 255.255.255.255
 no shutdown
!
router bgp 65002
 bgp log-neighbor-changes
 bgp router-id 172.16.3.1
 neighbor 192.168.20.1 remote-as 65000
 !
 address-family ipv4
  neighbor 192.168.20.1 activate
  network 172.16.3.2 mask 255.255.255.255
 exit-address-family
!
line vty 0 4
 login local
 transport input ssh
!
end
